aid: hubble-protocol
name: Hubble Protocol
description: >-
  Hubble Protocol is a Solana-based decentralized finance (DeFi) protocol that
  lets users borrow the USDH stablecoin against multiple crypto collateral
  assets (SOL, mSOL, stSOL, ETH, BTC and more) with interest-free, fixed-fee
  loans held open for unlimited time. The protocol pairs a Stability Vault, a
  Peg Stability Module, a hybrid liquidation model, and native yield on
  deposited collateral. Developers integrate with Hubble on-chain through its
  Anchor programs (IDLs published on GitHub) and the open-source
  "@hubbleprotocol/hubble-sdk" TypeScript client, which exposes borrowing market
  states, HBB staking and USDH stability-pool data, user loans, treasury and
  circulating-supply metrics, and peg-stability swaps. Hubble published security
  audits (Arcadia, Kudelski, Smart State, Sec3) and runs a funded bug-bounty
  program; its core contributors later built Kamino Finance.
